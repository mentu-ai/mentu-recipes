name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, Attest, Publish
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Version Matches Tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          declared="$(sed -n 's/.*static let string = "\([^"]*\)".*/\1/p' Sources/mentu-recipes/Version.swift)"
          if [ "v${declared}" != "${TAG}" ]; then
            echo "Version.swift declares ${declared} but the tag is ${TAG}" >&2
            exit 1
          fi
          echo "Version ${declared} matches ${TAG}"

      - name: Test
        run: swift test

      - name: Release Source Gate
        run: |
          swift run mentu-recipes scan .
          ./scripts/release-validate.sh --source

      - name: Build Release Binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Stage Artifacts
        run: |
          set -eu
          BUILT=".build/apple/Products/Release/mentu-recipes"
          mkdir -p dist
          for ARCH in arm64 x86_64; do
            OUT="dist/mentu-recipes-macos-${ARCH}"
            lipo -thin "$ARCH" "$BUILT" -output "$OUT"
            # strip invalidates the linker signature, so re-apply an ad-hoc one
            strip -x "$OUT"
            codesign --force --sign - --timestamp=none "$OUT"
            codesign --verify --strict --verbose=2 "$OUT"
          done

      - name: Binary Release Gate
        run: |
          set -eu
          for ARCH in arm64 x86_64; do
            ./scripts/release-validate.sh --binary "dist/mentu-recipes-macos-${ARCH}"
          done

      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          shasum -a 256 mentu-recipes-macos-arm64 mentu-recipes-macos-x86_64 > checksums.txt
          cat checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/mentu-recipes-macos-arm64
            dist/mentu-recipes-macos-x86_64

      - name: Release Notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ARM_SHA="$(shasum -a 256 dist/mentu-recipes-macos-arm64 | cut -d' ' -f1)"
          X86_SHA="$(shasum -a 256 dist/mentu-recipes-macos-x86_64 | cut -d' ' -f1)"
          cat > release-notes.md <<EOF
          Mentu Recipes is a source-available runner for file-based agent workflows: you define recipes in \`.mentu/recipes\`, keep reusable prompts in \`.mentu/prompts\`, and run them locally against OpenAI, Claude, OpenAI-compatible providers, local model servers, or shell steps. This release ships the \`mentu-recipes\` command line runner as a macOS binary for Apple Silicon and Intel.

          ## Install

          Apple Silicon:

          \`\`\`sh
          curl -fL -o mentu-recipes https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mentu-recipes-macos-arm64
          chmod +x mentu-recipes
          ./mentu-recipes --help
          \`\`\`

          Intel:

          \`\`\`sh
          curl -fL -o mentu-recipes https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mentu-recipes-macos-x86_64
          chmod +x mentu-recipes
          ./mentu-recipes --help
          \`\`\`

          ## Verify what you downloaded

          These binaries were built by GitHub Actions from the tagged source of this repository, and each one carries a signed build provenance attestation. You do not have to trust our word for where the binary came from: you can check it yourself.

          Check the digest:

          \`\`\`sh
          curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/checksums.txt
          shasum -c checksums.txt
          \`\`\`

          Expected digests for ${TAG}:

          \`\`\`
          ${ARM_SHA}  mentu-recipes-macos-arm64
          ${X86_SHA}  mentu-recipes-macos-x86_64
          \`\`\`

          Check the build provenance, which ties the binary to the workflow, repository, and commit that produced it:

          \`\`\`sh
          gh attestation verify mentu-recipes-macos-arm64 --owner mentu-ai
          \`\`\`

          A passing result means the binary you hold was produced by this repository's release workflow at this tag, and not rebuilt or substituted by anyone afterwards.

          ## Install via Homebrew

          The binary is also published through the Mentu tap at [mentu-ai/homebrew-tap](https://github.com/mentu-ai/homebrew-tap):

          \`\`\`sh
          brew install mentu-ai/tap/mentu-recipes-bin
          \`\`\`

          The signed and notarized macOS installer package remains available as a cask:

          \`\`\`sh
          brew install --cask mentu-ai/tap/mentu-recipes
          \`\`\`
          EOF
          cat release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mentu Recipes ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/mentu-recipes-macos-arm64
            dist/mentu-recipes-macos-x86_64
            dist/checksums.txt
