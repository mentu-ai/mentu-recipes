name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test And Scan
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Continuity Boundary Tests
        run: python3 -B -m unittest discover -s integrations/continuity -p 'test_*.py'

      - name: Release Source Scan
        run: swift run mentu-recipes scan .

      - name: Release Gate
        run: ./scripts/release-validate.sh --source
